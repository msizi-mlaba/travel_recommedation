<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - TravelBloom</title>
  <meta name="description" content="Get in touch with TravelBloom for travel recommendations, queries, and bookings." />
  <link rel="stylesheet" href="./travel_recommendation.css" />
</head>

<body>

  <!-- Background Imagery matching screenshots -->
  <div class="background-wrapper"></div>
  <div class="background-overlay"></div>

  <!-- Navigation Section (All 6 Menu Items & Logo) -->
  <nav class="navbar" aria-label="Main Navigation">
    <a href="index.html" class="nav-brand" aria-label="TravelBloom Home">
      <div class="brand-icon-box">

      </div>
      <span class="brand-title">TravelBloom</span>
    </a>

    <!-- Menu Item 1, 2, 3: Links -->
    <div class="nav-links">
      <a href="index.html" class="nav-link" id="nav-home">Home</a>
      <a href="about_us.html" class="nav-link" id="nav-about">About Us</a>
      <a href="contact_us.html" class="nav-link active" id="nav-contact">Contact Us</a>
    </div>

    <!-- Menu Item 4, 5, 6: Search bar input box, Search button, Clear button -->
    <div class="nav-search-group">
      <div class="search-input-wrapper">
        <input type="text" id="search-input" class="search-input" placeholder="Enter a destination or keyword"
          aria-label="Enter a destination or keyword" />
        <svg class="search-icon-inside" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <button type="button" id="search-button" class="btn-search">Search</button>
      <button type="button" id="clear-button" class="btn-clear">Clear</button>
    </div>
  </nav>

  <!-- Left Floating Social Bar -->
  <aside class="social-sidebar" aria-label="Social Media">

    <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
      <svg viewBox="0 0 24 24">
        <path
          d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />

      </svg>

  </aside>

  <!-- Main Content Body -->
  <main class="main-container">
    <section class="contact-section">
      <!-- Left Column -->
      <div class="contact-info-col">
        <h1 class="contact-main-title">CONTACT US</h1>
        <p class="contact-subtitle">Get in touch</p>

        <div class="contact-details">
          <div class="contact-item-row">
            <div class="contact-icon-bubble">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </div>
            <div>
              <div style="font-weight: 600; color: #ffffff;">Email</div>
              <div style="color: rgba(255,255,255,0.75);">contact@travelbloom.com</div>
            </div>
          </div>

          <div class="contact-item-row">
            <div class="contact-icon-bubble">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                <path
                  d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                </path>
              </svg>
            </div>
            <div>
              <div style="font-weight: 600; color: #ffffff;">Phone</div>
              <div style="color: rgba(255,255,255,0.75);">+1 (800) 555-BLOOM</div>
            </div>
          </div>

          <div class="contact-item-row">
            <div class="contact-icon-bubble">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
            </div>
            <div>
              <div style="font-weight: 600; color: #ffffff;">Headquarters</div>
              <div style="color: rgba(255,255,255,0.75);">Sydney &amp; Tokyo Global Hubs</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Column: Contact Form (Matching Image 3) -->
      <div class="contact-form-card" id="contact-form-card">
        <form onsubmit="handleContactSubmit(event)">
          <div class="form-group">
            <label for="contact-name">Name</label>
            <input type="text" id="contact-name" class="form-input" placeholder="Enter your name" required />
          </div>

          <div class="form-group">
            <label for="contact-email">Email</label>
            <input type="email" id="contact-email" class="form-input" placeholder="Enter your email" required />
          </div>

          <div class="form-group">
            <label for="contact-message">Message</label>
            <textarea id="contact-message" class="form-textarea" placeholder="Enter your message" required></textarea>
          </div>

          <button type="submit" class="btn-submit">Submit</button>
        </form>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="site-footer footer" id="site-footer">
    <p>&copy; 2026 TravelBloom. All rights reserved. Travel Recommendation Website.</p>
  </footer>

  <!-- Scripts -->
  <script src="./travel_recommendation.js"></script>
</body>

</html>
